<!doctype html>
<html lang="el">
<head>
  <!-- Ελευθερία Κουτσοχρήστου mpsp2519 -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hogwarts Spell & Potion Manager</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <!-- Header -->
    <header class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
      <h1 class="h3 mb-0">Hogwarts – Διαχειριστής Ξορκιών & Φίλτρων</h1>
    </header>

    <!-- Main Content -->
    <main class="row g-3">
      <!-- Form Column -->
      <aside class="col-12 col-lg-4">
        <div class="card glass text-white">
          <div class="card-body">
            <h2 class="h5 mb-3">Προσθήκη Ξορκιού / Φίλτρου</h2>

            <!-- Warning Box -->
            <div id="warnBox" class="alert alert-danger d-none py-2 mb-3" role="alert"></div>

            <!-- Form Fields -->
            <form id="spellForm">
              <div class="mb-3">
                <label for="name" class="form-label">Όνομα</label>
                <input id="name" type="text" class="form-control" placeholder="π.χ. Expelliarmus" required>
              </div>

              <div class="row g-2">
                <div class="col-6">
                  <label for="type" class="form-label">Τύπος</label>
                  <select id="type" class="form-select" required>
                    <option value="">-- Επίλεξε --</option>
                    <option value="spell">Ξόρκι</option>
                    <option value="potion">Φίλτρο</option>
                  </select>
                </div>
                <div class="col-6">
                  <label for="element" class="form-label">Στοιχείο</label>
                  <select id="element" class="form-select" required>
                    <option value="">-- Επίλεξε --</option>
                    <option value="fire">Φωτιά</option>
                    <option value="ice">Πάγος</option>
                    <option value="lightning">Αστραπή</option>
                    <option value="earth">Γη</option>
                  </select>
                </div>
              </div>

              <div class="row g-2 mt-2">
                <div class="col-6">
                  <label for="power" class="form-label">Δύναμη (1–100)</label>
                  <input id="power" type="number" min="1" max="100" value="40" class="form-control" required>
                </div>
                <div class="col-6">
                  <label for="rarity" class="form-label">Σπανιότητα</label>
                  <select id="rarity" class="form-select" required>
                    <option value="">-- Επίλεξε --</option>
                    <option value="common">Κοινό</option>
                    <option value="rare">Σπάνιο</option>
                    <option value="epic">Επικό</option>
                    <option value="legendary">Θρυλικό</option>
                    <option value="wow">Ουαου</option>
                  </select>
                </div>
              </div>

              <div class="mt-3">
                <label for="desc" class="form-label">Περιγραφή</label>
                <textarea id="desc" rows="3" class="form-control" placeholder="Μια σύντομη περιγραφή..."required></textarea>
              </div>

              <button id="addBtn" type="submit" class="btn btn-primary w-100 mt-3">
                Προσθήκη
              </button>
            </form>
          </div>
        </div>
      </aside>

      <!-- List Column -->
      <section class="col-12 col-lg-8">
        <div class="card glass text-white">
          <div class="card-body">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-3">
              <h2 class="h5 mb-0">Λίστα Μαγικών Αντικειμένων</h2>

            
              <!-- Stats -->
              <div id="stats" class="d-flex gap-2 flex-wrap"></div>
            </div>
            <!-- Container for items -->
            <div id="labContainer"></div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="muted small mt-4">
      💡 Tip: Άνοιξε DevTools για να βλέπεις errors/console logs όπως κάναμε στο μάθημα!
    </footer>
  </div>

  <!-- Scripts -->
  <script src="script.js"></script>
</body>
</html>
